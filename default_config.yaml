# Hindsight plugin configuration defaults
#
# Settings are split into two categories:
#
# GLOBAL (shared across all projects):
#   - hindsight_base_url: Hindsight server URL
#   - hindsight_bank_prefix: Prefix combined with project name for bank isolation
#   These are always read from the global (no-project) scope.
#
# PER-PROJECT (can vary per project via the project selector):
#   - hindsight_bank_id: Explicit bank ID override
#   - hindsight_retain_enabled: Store conversation memories after each interaction
#   - hindsight_recall_enabled: Enrich recall with semantic search
#   - All other settings below
#   Use the "Default" project for fallback values that apply when a
#   project has no explicit override.

# ─── Global Settings ────────────────────────────────────────

# Hindsight Base URL - the server endpoint
# Also settable via HINDSIGHT_BASE_URL environment variable (takes priority)
hindsight_base_url: ""

# Bank ID prefix - combined with project name for isolation
hindsight_bank_prefix: "a0"

# ─── Per-Project Settings ───────────────────────────────────

# Explicit bank ID override (leave blank for auto-derivation: prefix-projectname)
hindsight_bank_id: ""

# Enable/disable individual Hindsight operations
hindsight_retain_enabled: true
hindsight_recall_enabled: true
hindsight_solution_extract_enabled: false
hindsight_scheduler_task_log_enabled: true

# Recall settings
hindsight_recall_max_tokens: 4096
hindsight_recall_budget: "mid"

# Show one concise status line per Hindsight API operation
hindsight_operation_logging: true

# Debug logging
hindsight_debug: false

# Context sent with structured chatlog retain_batch calls
hindsight_retain_context: "conversation between AI Agent and the User"

# Optional tag added to retained items when multiple agents share a bank.
# Leave blank to disable.
hindsight_shared_bank_tag: "shared-memory"

# Retain after either threshold is reached since the last successful retain.
# Set both to 0 to retain after every eligible agent turn.
hindsight_retain_min_messages: 3
hindsight_retain_min_chars: 800

# Scheduled task turns skip recall/chatlog/solution extraction. When enabled,
# their final result is retained as one stable task-log document instead.
hindsight_scheduler_task_context: "automated task execution result and status log"


# Optional nightly dreaming workflow.
# Disabled by default. When enabled, Agent Zero opportunistically runs the
# workflow after foreground turns once the interval is due. It refreshes mental
# models, waits for refresh jobs, and stores one tagged dream-journal synthesis
# at most once per day.
hindsight_dreaming_enabled: false
hindsight_dreaming_interval_hours: 24
hindsight_dreaming_min_model_refresh_age_hours: 12
hindsight_dreaming_wait_for_refresh: true
hindsight_dreaming_operation_timeout_seconds: 900
hindsight_dreaming_poll_seconds: 5
hindsight_dreaming_synthesis_enabled: true
hindsight_dreaming_synthesis_budget: "mid"
hindsight_dreaming_synthesis_max_tokens: 2048


# Optional reusable solution extraction.
# This is the only Hermes-style path that may call Agent Zero's utility LLM.
# The heuristic gate requires both tool activity and enough new chatlog text.
hindsight_solution_extract_min_tool_calls: 1
hindsight_solution_extract_min_chars: 1200
hindsight_solution_extract_max_history_chars: 80000
hindsight_solution_context: "successful Agent Zero task outcome / reusable solution"
