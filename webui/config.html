<html>
<head>
    <title>Hindsight Memory Configuration</title>
</head>

<body>
    <div x-data>
        <template x-if="config">
            <div>
                <div class="section-title">Hindsight Memory Lifecycle</div>
                <div class="section-description">
                    Adds a lean Hindsight memory layer to Agent Zero: one recall before a user turn is answered,
                    then one structured chatlog retain after the final response. The recalled context is fenced and
                    injected as temporary background context, not stored in Agent Zero history.
                </div>

                <div class="section-description" style="margin-bottom: 1rem; padding: 0.5rem; background: var(--bg-secondary, #1a1a2e); border-radius: 6px; border-left: 3px solid var(--accent, #6c63ff);">
                    <strong>Server and Bank</strong> - Connection settings and memory-bank selection.
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Hindsight Base URL</div>
                        <div class="field-description">
                            URL of the running Hindsight API server. Example: <code>http://100.107.17.69:8888</code>.
                            This is shared across projects unless overridden by <code>HINDSIGHT_BASE_URL</code>.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text"
                               x-model="config.hindsight_base_url"
                               placeholder="http://localhost:8888" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Explicit Bank ID</div>
                        <div class="field-description">
                            Use a specific Hindsight bank. For testing this should be <code>memento-test</code>.
                            Leave blank only if you want project-derived banks.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text"
                               x-model="config.hindsight_bank_id"
                               placeholder="memento-test" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Bank ID Prefix</div>
                        <div class="field-description">
                            Used only when Explicit Bank ID is blank. The derived bank is prefix plus project name,
                            or prefix plus <code>default</code> when no project is active.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text"
                               x-model="config.hindsight_bank_prefix"
                               placeholder="a0" />
                    </div>
                </div>

                <div style="margin-top: 1.5rem;"></div>
                <div class="section-description" style="margin-bottom: 1rem; padding: 0.5rem; background: var(--bg-secondary, #1a1a2e); border-radius: 6px; border-left: 3px solid var(--success, #4caf50);">
                    <strong>Structured Chatlog Retain</strong> - Stores one structured conversation document with a stable
                    <code>document_id</code>, similar to the Hermes integration.
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Enable Chatlog Retain</div>
                        <div class="field-description">
                            After the final response, retain the conversation as one structured chatlog via
                            <code>retain_batch</code>. This does not call a utility LLM and does not write per-fragment memories.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox"
                                   x-model="config.hindsight_retain_enabled" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Retain Context</div>
                        <div class="field-description">
                            Context string sent with each structured chatlog retain. Keep this descriptive; it guides
                            Hindsight's extraction from the chatlog.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text"
                               x-model="config.hindsight_retain_context"
                               placeholder="conversation between AI Agent and the User" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Shared Bank Tag</div>
                        <div class="field-description">
                            Optional tag added to retained chatlogs, solutions, and scheduler logs when multiple agents
                            write to the same Hindsight bank. Leave blank to disable.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text"
                               x-model="config.hindsight_shared_bank_tag"
                               placeholder="shared-memory" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Retain After Messages</div>
                        <div class="field-description">
                            Retain once this many new chatlog entries have accumulated since the last successful retain.
                            Use <code>0</code> to disable this threshold.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="number"
                               x-model.number="config.hindsight_retain_min_messages"
                               placeholder="3" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Retain After Characters</div>
                        <div class="field-description">
                            Retain once this many new chatlog characters have accumulated. This batches short replies
                            while still retaining long substantive messages promptly. Use <code>0</code> to disable.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="number"
                               x-model.number="config.hindsight_retain_min_chars"
                               placeholder="800" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Scheduled Task Result Logs</div>
                        <div class="field-description">
                            Skip recall, chatlog retain, and solution extraction for scheduler turns. Instead, retain
                            one stable Hindsight document per task containing the latest result or failure summary.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox"
                                   x-model="config.hindsight_scheduler_task_log_enabled" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field" x-show="config.hindsight_scheduler_task_log_enabled">
                    <div class="field-label">
                        <div class="field-title">Scheduled Task Context</div>
                        <div class="field-description">
                            Context sent with retained scheduler result documents.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text"
                               x-model="config.hindsight_scheduler_task_context"
                               placeholder="automated task execution result and status log" />
                    </div>
                </div>

                <div style="margin-top: 1.5rem;"></div>
                <div class="section-description" style="margin-bottom: 1rem; padding: 0.5rem; background: var(--bg-secondary, #1a1a2e); border-radius: 6px; border-left: 3px solid var(--warning, #ff9800);">
                    <strong>Reusable Solution Extraction</strong> - Optional utility-model extraction of successful technical
                    solutions, retained to Hindsight with <code>solution</code> tags only after the heuristic gate passes.
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Enable Solution Extraction</div>
                        <div class="field-description">
                            When enabled, the plugin may call Agent Zero's utility model after substantive tool-backed work
                            to extract reusable successful solutions.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox"
                                   x-model="config.hindsight_solution_extract_enabled" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div x-show="config.hindsight_solution_extract_enabled">
                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Solution Min Tool Calls</div>
                            <div class="field-description">
                                Require this many new tool result messages since the last solution check. Use <code>0</code>
                                to allow extraction without tool activity.
                            </div>
                        </div>
                        <div class="field-control">
                            <input type="number"
                                   x-model.number="config.hindsight_solution_extract_min_tool_calls"
                                   placeholder="1" />
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Solution Min Characters</div>
                            <div class="field-description">
                                Require this many new chatlog characters since the last solution check. This prevents short
                                follow-up messages from triggering the utility model.
                            </div>
                        </div>
                        <div class="field-control">
                            <input type="number"
                                   x-model.number="config.hindsight_solution_extract_min_chars"
                                   placeholder="1200" />
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Solution History Window</div>
                            <div class="field-description">
                                Maximum recent history characters sent to the utility model for solution extraction.
                            </div>
                        </div>
                        <div class="field-control">
                            <input type="number"
                                   x-model.number="config.hindsight_solution_extract_max_history_chars"
                                   placeholder="80000" />
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Solution Context</div>
                            <div class="field-description">
                                Context sent with retained solution documents. It guides Hindsight's extraction and
                                consolidation of reusable workflows.
                            </div>
                        </div>
                        <div class="field-control">
                            <input type="text"
                                   x-model="config.hindsight_solution_context"
                                   placeholder="successful Agent Zero task outcome / reusable solution" />
                        </div>
                    </div>
                </div>

                <div style="margin-top: 1.5rem;"></div>
                <div class="section-description" style="margin-bottom: 1rem; padding: 0.5rem; background: var(--bg-secondary, #1a1a2e); border-radius: 6px; border-left: 3px solid var(--success, #4caf50);">
                    <strong>Recall Injection</strong> - Searches Hindsight once per user turn and injects fenced temporary context.
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Enable Recall</div>
                        <div class="field-description">
                            Run one Hindsight recall from the clean user message before the LLM call. Results are injected
                            into <code>&lt;memory-context&gt;</code> as background information.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox"
                                   x-model="config.hindsight_recall_enabled" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Recall Max Tokens</div>
                        <div class="field-description">
                            Maximum tokens returned by Hindsight recall.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="number"
                               x-model.number="config.hindsight_recall_max_tokens"
                               placeholder="4096" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Recall Budget</div>
                        <div class="field-description">
                            Hindsight recall budget: <code>low</code>, <code>mid</code>, or <code>high</code>.
                        </div>
                    </div>
                    <div class="field-control">
                        <select x-model="config.hindsight_recall_budget">
                            <option value="low">Low</option>
                            <option value="mid">Mid</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Operation Logging</div>
                        <div class="field-description">
                            Show one concise Agent Zero log entry for each actual Hindsight API operation, such as recall
                            or chatlog retain.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox"
                                   x-model="config.hindsight_operation_logging" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Debug Logging</div>
                        <div class="field-description">
                            Enable extra Hindsight lifecycle logs for troubleshooting.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox"
                                   x-model="config.hindsight_debug" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="section-description" style="margin-top: 1rem; opacity: 0.7;">
                    <strong>Note:</strong> The lean lifecycle does not expose Hindsight tools and does not call a utility LLM
                    to extract memory fragments. Optional solution extraction is the only path that may call the utility model,
                    and it is gated by tool activity plus chatlog size. Hindsight will still show individual facts in its bank
                    because it extracts them internally from retained documents. <code>HINDSIGHT_API_KEY</code> is optional for local
                    servers and can be set in <strong>Settings -> Secrets</strong>.
                </div>
            </div>
        </template>
    </div>
</body>
</html>
